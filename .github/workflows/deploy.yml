name: Deploy Frontend to EC2

on:
  push:
    branches:
      - dev

env:
  NODE_ENV: production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-2 | \
          docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }} \
            --build-arg NODE_ENV=${NODE_ENV} \
            -t ${IMAGE_NAME}:latest .
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: Tag and Push Docker Image
        run: |
          docker tag ${IMAGE_NAME}:latest ${{ vars.ECR_REGISTRY }}/meetly-omni-frontend:latest
          docker push ${{ vars.ECR_REGISTRY }}/meetly-omni-frontend:latest
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR on EC2
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=ap-southeast-2
            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

            # Pull, run, swap container
            docker pull ${{ vars.ECR_REGISTRY }}/meetly-omni-frontend:latest
            docker rm -f ${IMAGE_NAME}-new || true
            docker run -d -p 3001:3000 --name ${IMAGE_NAME}-new ${{ vars.ECR_REGISTRY }}/meetly-omni-frontend:latest
            echo "Waiting for new container to start..."
            sleep 5
            docker stop ${IMAGE_NAME} || true
            docker rename ${IMAGE_NAME}-new ${IMAGE_NAME}
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
